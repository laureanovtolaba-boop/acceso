<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Scan to Web</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        .tarjeta { max-width: 450px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* Este campo invisible o estilizado recibirá la información que escanee Scan to Web */
        input { width: 85%; padding: 14px; font-size: 1.1rem; border: 2px solid #007bff; border-radius: 5px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; display: none; }
        .autorizado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .denegado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h2>Control de Acceso DNI</h2>
        <p>Toque el recuadro de abajo para activar el lector de barras nativo de Scan to Web.</p>
        
        <!-- Al hacer foco en este input, la app Scan to Web abrirá tu cámara automáticamente -->
        <input type="text" id="dni_entrada" placeholder="Toque aquí para escanear" oninput="procesarLecturaApp(this.value)" autofocus>
        
        <div id="resultado"></div>
    </div>

    <script>
        // Tu URL de Google Apps Script vinculada de forma directa
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcGBT4RFgvnba-rB4Fn4PhJXUuNLJPjoUjW9ulaX38yoNyWiB3MWU_aFAssC0MejX9hw/exec";
        const resultadoDiv = document.getElementById('resultado');
        const campoInput = document.getElementById('dni_entrada');

        function procesarLecturaApp(textoEscaneado) {
            if (!textoEscaneado) return;
            
            // El DNI argentino separa los campos mediante arrobas (@)
            const campos = textoEscaneado.split('@');
            
            if (campos.length >= 5) {
                // Buscamos un bloque de texto que tenga entre 7 y 8 números seguidos (el número de documento)
                let dniDetectado = campos.find(c => /^\d{7,8}\$/.test(c.trim()));
                if (dniDetectado) {
                    enviarAGoogleSheets(dniDetectado.trim());
                }
            } else {
                // Si la aplicación ya viene configurada para filtrar y mandar solo el número limpio
                if (/^\d{7,8}\$/.test(textoEscaneado.trim())) {
                    enviarAGoogleSheets(textoEscaneado.trim());
                }
            }
        }

        function enviarAGoogleSheets(dni) {
            resultadoDiv.style.display = "block";
            resultadoDiv.className = "";
            resultadoDiv.innerHTML = "🔍 Consultando base de datos...";
            campoInput.value = ""; // Limpiamos el cuadro de texto para el próximo DNI

            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "cors",
                body: JSON.stringify({ dni: dni })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.autorizado) {
                        resultadoDiv.className = "autorizado";
                        resultadoDiv.innerHTML = `✅ ACCESO PERMITIDO<br>${data.nombre}<br>DNI: ${dni}`;
                    } else {
                        resultadoDiv.className = "denegado";
                        resultadoDiv.innerHTML = `🚨 ALERTA: NO AUTORIZADO<br>DNI: ${dni} no está en la lista.`;
                    }
                } else {
                    resultadoDiv.innerHTML = "⚠️ Error en la respuesta de Google.";
                }
                
                // Forzar que el teclado/foco vuelva al campo de texto de forma automática
                setTimeout(() => { campoInput.focus(); }, 1000);
            })
            .catch(err => {
                console.error("Error:", err);
                resultadoDiv.className = "denegado";
                resultadoDiv.innerHTML = "❌ Error de conexión con Google Sheets.";
                setTimeout(() => { campoInput.focus(); }, 1000);
            });
        }
    </script>
</body>
</html>
