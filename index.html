<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Escáner DNI</title>
    
    <!-- Cargamos la librería html5-qrcode -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        #contenedor-camara { width: 100%; max-width: 500px; margin: auto; border: 3px solid #ccc; border-radius: 8px; overflow: hidden; background-color: #000; min-height: 250px; position: relative; }
        #reader { width: 100% !important; border: none !important; }
        #reader video { width: 100% !important; height: auto !important; display: block !important; }
        #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; display: none; }
        .autorizado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .denegado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-iniciar { background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 5px; margin: 15px auto; cursor: pointer; display: block; }
        .btn-iniciar:active { background-color: #1e7e34; }
    </style>
</head>
<body>

    <h2>Escáner Web de DNI Argentino</h2>
    <p>Presione el botón para forzar el encendido del lente trasero principal.</p>
    
    <!-- Botón con ID corregido para ejecución selectiva -->
    <button class="btn-iniciar" id="btn-arrancar" onclick="obtenerCamarasYForzar()">ENCENDER ESCÁNER</button>

    <div id="contenedor-camara">
        <div id="reader"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcGBT4RFgvnba-rB4Fn4PhJXUuNLJPjoUjW9ulaX38yoNyWiB3MWU_aFAssC0MejX9hw/exec"; 
        const resultadoDiv = document.getElementById('resultado');
        const botonArrancar = document.getElementById('btn-arrancar');
        let escaneando = true;
        let html5QrcodeScanner = null;

        function obtenerCamarasYForzar() {
            botonArrancar.style.display = "none";
            
            // Le pedimos a la librería que enumere todas las cámaras físicas del celular
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length > 0) {
                    // FILTRO SAMSUNG: Buscamos cámaras que apunten atrás usando palabras clave de One UI
                    let camaraTraseraPrincipal = devices.find(device => 
                        device.label.toLowerCase().includes("back") || 
                        device.label.toLowerCase().includes("trasera") || 
                        device.label.toLowerCase().includes("0, 1") || // Formato de lentes múltiples de Samsung
                        device.label.toLowerCase().includes("dirección hacia atrás")
                    );

                    // Si encuentra la trasera la usa, si no, tomamos la última de la lista (que por orden de hardware en el A23 es la de 50MP)
                    let idSeleccionado = camaraTraseraPrincipal ? camaraTraseraPrincipal.id : devices[devices.length - 1].id;
                    
                    arrancarMotorConId(idSeleccionado);
                } else {
                    alert("No se detectaron cámaras de hardware disponibles.");
                    botonArrancar.style.display = "block";
                }
            }).catch(err => {
                console.error("Error al listar componentes:", err);
                alert("Error de permisos de hardware.");
                botonArrancar.style.display = "block";
            });
        }

        function arrancarMotorConId(deviceId) {
            html5QrcodeScanner = new Html5Qrcode("reader");

            const configuracion = { 
                fps: 10, 
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    return { width: Math.floor(viewfinderWidth * 0.85), height: Math.floor(viewfinderHeight * 0.5) };
                },
                formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
            };

            // Iniciamos de forma estricta pasando el ID único de la lente trasera principal
            html5QrcodeScanner.start(
                deviceId, 
                configuracion,
                (decodedText) => {
                    if (escaneando) {
                        procesarDatosDNI(decodedText);
                    }
                },
                (errorMessage) => {
                    // Ignorar fallas de lectura de fotogramas
                }
            ).catch((err) => {
                console.error("Error al inicializar dispositivo asignado:", err);
                alert("Error al levantar el video. Revisa los permisos de la app.");
                botonArrancar.style.display = "block";
            });
        }

        function procesarDatosDNI(textoEscaneado) {
            const campos = textoEscaneado.split('@');
            if (campos.length >= 5) {
                let dniDetectado = campos.find(c => /^\d{7,8}\$/.test(c.trim()));
                if (dniDetectado) {
                    escaneando = false;
                    enviarAGoogleSheets(dniDetectado.trim());
                }
            }
        }

        function enviarAGoogleSheets(dni) {
            resultadoDiv.style.display = "block";
            resultadoDiv.className = "";
            resultadoDiv.innerHTML = "🔍 Consultando base de datos...";

            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "cors",
                body: JSON.stringify({ dni: dni })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.autorizado) {
                        resultadoDiv.className = "autorizado";
                        resultadoDiv.innerHTML = `✅ ACCESO PERMITIDO<br>${data.nombre}<br>DNI: ${dni}`;
                    } else {
                        resultadoDiv.className = "denegado";
                        resultadoDiv.innerHTML = `🚨 ALERTA: NO AUTORIZADO<br>DNI: ${dni} no está en la lista.`;
                    }
                } else {
                    resultadoDiv.innerHTML = "⚠️ Error en la respuesta del servidor.";
                }
                setTimeout(() => { 
                    resultadoDiv.style.display = "none"; 
                    escaneando = true;
                }, 4000);
            })
            .catch(err => {
                console.error("Error:", err);
                resultadoDiv.className = "denegado";
                resultadoDiv.innerHTML = "❌ Error de conexión con Google Sheets.";
                setTimeout(() => { escaneando = true; }, 4000);
            });
        }
    </script>
</body>
</html>
