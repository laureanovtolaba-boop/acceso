<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Escáner DNI</title>
    
    <!-- Librería especializada -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        #contenedor-camara { width: 100%; max-width: 500px; margin: auto; border: 3px solid #ccc; border-radius: 8px; overflow: hidden; background-color: #000; min-height: 250px; position: relative; }
        #reader { width: 100% !important; border: none !important; }
        #reader video { width: 100% !important; height: auto !important; display: block !important; }
        #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; display: none; }
        .autorizado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .denegado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-iniciar { background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 5px; margin: 15px auto; cursor: pointer; display: block; }
        .btn-iniciar:active { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Escáner Web de DNI Argentino</h2>
    <p>Presione el botón para activar la cámara trasera y comience a escanear.</p>
    
    <!-- Botón de activación forzada para romper el bloqueo de One UI 6 -->
    <button class="btn-iniciar" id="btn-arrancar" onclick="encenderCamaraNativa()">ACTIVAR CÁMARA</button>

    <div id="contenedor-camara">
        <div id="reader"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcGBT4RFgvnba-rB4Fn4PhJXUuNLJPjoUjW9ulaX38yoNyWiB3MWU_aFAssC0MejX9hw/exec"; 
        const resultadoDiv = document.getElementById('resultado');
        const botonArrancar = document.getElementById('btn-arrancar');
        let escaneando = true;
        let html5QrcodeScanner = null;

        function encenderCamaraNativa() {
            // Ocultamos el botón para evitar doble clic
            botonArrancar.style.display = "none";

            // Inicializamos el motor sobre el contenedor div
            html5QrcodeScanner = new Html5Qrcode("reader");

            const configuracion = { 
                fps: 10, 
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    return { width: Math.floor(viewfinderWidth * 0.85), height: Math.floor(viewfinderHeight * 0.5) };
                },
                formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
            };

            // Ejecución vinculada a la interacción del botón físico
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                configuracion,
                (decodedText) => {
                    if (escaneando) {
                        procesarDatosDNI(decodedText);
                    }
                },
                (errorMessage) => {
                    // Ignorar errores de búsqueda de fotograma
                }
            ).catch((err) => {
                console.error("Error al encender:", err);
                alert("Por favor, dale acceso a la cámara si el navegador lo solicita.");
                botonArrancar.style.display = "block"; // Reaparece el botón si falló
            });
        }

        function procesarDatosDNI(textoEscaneado) {
            const campos = textoEscaneado.split('@');
            if (campos.length >= 5) {
                let dniDetectado = campos.find(c => /^\d{7,8}\$/.test(c.trim()));
                if (dniDetectado) {
                    escaneando = false;
                    enviarAGoogleSheets(dniDetectado.trim());
                }
            }
        }

        function enviarAGoogleSheets(dni) {
            resultadoDiv.style.display = "block";
            resultadoDiv.className = "";
            resultadoDiv.innerHTML = "🔍 Consultando base de datos...";

            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "cors",
                body: JSON.stringify({ dni: dni })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.autorizado) {
                        resultadoDiv.className = "autorizado";
                        resultadoDiv.innerHTML = `✅ ACCESO PERMITIDO<br>${data.nombre}<br>DNI: ${dni}`;
                    } else {
                        resultadoDiv.className = "denegado";
                        resultadoDiv.innerHTML = `🚨 ALERTA: NO AUTORIZADO<br>DNI: ${dni} no está en la lista.`;
                    }
                } else {
                    resultadoDiv.innerHTML = "⚠️ Error en la respuesta del servidor.";
                }
                setTimeout(() => { 
                    resultadoDiv.style.display = "none"; 
                    escaneando = true;
                }, 4000);
            })
            .catch(err => {
                console.error("Error:", err);
                resultadoDiv.className = "denegado";
                resultadoDiv.innerHTML = "❌ Error de conexión con Google Sheets.";
                setTimeout(() => { escaneando = true; }, 4000);
            });
        }
    </script>
</body>
</html>
