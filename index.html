<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Escáner DNI</title>
    
    <!-- Cambiamos a la librería especializada en corregir pantallas negras de Samsung -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        #contenedor-camara { width: 100%; max-width: 500px; margin: auto; border: 3px solid #ccc; border-radius: 8px; overflow: hidden; background-color: #000; position: relative; }
        /* Forzamos dimensiones y visualización nativa */
        #reader { width: 100% !important; border: none !important; }
        #reader video { width: 100% !important; height: auto !important; display: block !important; }
        #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; display: none; }
        .autorizado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .denegado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>Escáner Web de DNI Argentino</h2>
    <p>Coloque el código de barras del DNI horizontalmente dentro del recuadro de la cámara.</p>

    <div id="contenedor-camara">
        <!-- El motor inyectará el video directamente aquí -->
        <div id="reader"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const URL_SCRIPT_GOOGLE = "https://script.google.com/macros/s/AKfycbzcGBT4RFgvnba-rB4Fn4PhJXUuNLJPjoUjW9ulaX38yoNyWiB3MWU_aFAssC0MejX9hw/exec"; 
        const resultadoDiv = document.getElementById('resultado');
        let escaneando = true;

        // Inicializamos el nuevo motor de lectura
        const html5QrcodeScanner = new Html5Qrcode("reader");

        // Configuración nativa para decodificar PDF417 (DNI Argentino)
        const configuracion = { 
            fps: 15, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Creamos un recuadro optimizado horizontal para el DNI
                return { width: Math.floor(viewfinderWidth * 0.85), height: Math.floor(viewfinderHeight * 0.45) };
            },
            formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        };

        // Forzamos el inicio de la cámara trasera de forma nativa e inmediata
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            configuracion,
            (decodedText) => {
                // Al detectar una lectura exitosa
                if (escaneando) {
                    procesarDatosDNI(decodedText);
                }
            },
            (errorMessage) => {
                // Errores de enfoque continuos se ignoran silenciosamente
            }
        ).catch((err) => {
            console.error("Error crítico al encender cámara:", err);
            alert("No se pudo iniciar la cámara trasera. Asegúrate de otorgar los permisos necesarios.");
        });

        function procesarDatosDNI(textoEscaneado) {
            const campos = textoEscaneado.split('@');
            if (campos.length >= 5) {
                let dniDetectado = campos.find(c => /^\d{7,8}\$/.test(c.trim()));
                if (dniDetectado) {
                    escaneando = false;
                    enviarAGoogleSheets(dniDetectado.trim());
                }
            }
        }

        function enviarAGoogleSheets(dni) {
            resultadoDiv.style.display = "block";
            resultadoDiv.className = "";
            resultadoDiv.innerHTML = "🔍 Consultando base de datos...";

            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "cors",
                body: JSON.stringify({ dni: dni })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.autorizado) {
                        resultadoDiv.className = "autorizado";
                        resultadoDiv.innerHTML = `✅ ACCESO PERMITIDO<br>${data.nombre}<br>DNI: ${dni}`;
                    } else {
                        resultadoDiv.className = "denegado";
                        resultadoDiv.innerHTML = `🚨 ALERTA: NO AUTORIZADO<br>DNI: ${dni} no está en la lista.`;
                    }
                } else {
                    resultadoDiv.innerHTML = "⚠️ Error en la respuesta del servidor.";
                }
                setTimeout(() => { 
                    resultadoDiv.style.display = "none"; 
                    escaneando = true;
                }, 4000);
            })
            .catch(err => {
                console.error("Error:", err);
                resultadoDiv.className = "denegado";
                resultadoDiv.innerHTML = "❌ Error de conexión con Google Sheets.";
                setTimeout(() => { escaneando = true; }, 4000);
            });
        }
    </script>
</body>
</html>
