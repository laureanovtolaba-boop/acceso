<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Escáner DNI</title>
    
    <!-- CORREGIDO: Ahora descarga el motor completo y correcto de ZXing -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        #contenedor-camara { width: 100%; max-width: 500px; margin: auto; position: relative; border: 3px solid #ccc; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        .guia-escaneo { position: absolute; top: 25%; left: 5%; width: 90%; height: 50%; border: 3px dashed #007bff; box-sizing: border-box; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); }
        #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; display: none; }
        .autorizado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .denegado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>Escáner Web de DNI Argentino</h2>
    <p>Coloque el código de barras del DNI horizontalmente dentro del recuadro azul.</p>

    <div id="contenedor-camara">
        <video id="video-camara"></video>
        <div class="guia-escaneo"></div>
    </div>

    <div id="resultado"></div>

    <script>
        // REEMPLAZA ESTO CON TU LINK DE GOOGLE SHEETS (El que termina en /exec)
        const URL_SCRIPT_GOOGLE = "TU_URL_DE_APPS_SCRIPT_AQUI"; 
        
        const videoElement = document.getElementById('video-camara');
        const resultadoDiv = document.getElementById('resultado');
        let escaneando = true;
        
        // OPTIMIZADO: Cambiado a MultiFormatReader para soporte nativo real de PDF417
        const codeReader = new ZXing.BrowserMultiFormatReader();

        // Encender la cámara trasera con alta resolución para distinguir las líneas finas del DNI
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            } 
        })
        .then((stream) => {
            videoElement.srcObject = stream;
            videoElement.setAttribute("playsinline", true);
            videoElement.play();
            escanearFramerates();
        })
        .catch(err => {
            console.error("Error al acceder a la cámara: ", err);
            alert("No se pudo iniciar la cámara. Asegúrate de dar los permisos y de ingresar usando HTTPS.");
        });

        function escanearFramerates() {
            // Configuramos el motor para que busque exclusivamente códigos PDF417 de DNI
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.PDF_417]);
            
            codeReader.decodeFromVideoElement(videoElement, (result, err) => {
                if (result && escaneando) {
                    procesarDatosDNI(result.text);
                }
            }, hints);
        }

        function procesarDatosDNI(textoEscaneado) {
            // El DNI argentino separa los datos con arrobas (@)
            const campos = textoEscaneado.split('@');
            if (campos.length >= 5) {
                // Buscamos un bloque de texto que tenga entre 7 y 8 números seguidos (el número de documento)
                let dniDetectado = campos.find(c => /^\d{7,8}\$/.test(c.trim()));
                if (dniDetectado) {
                    escaneando = false; // Pausamos temporalmente el escáner para evitar duplicados
                    enviarAGoogleSheets(dniDetectado.trim());
                }
            }
        }

        function enviarAGoogleSheets(dni) {
            resultadoDiv.style.display = "block";
            resultadoDiv.className = "";
            resultadoDiv.innerHTML = "🔍 Consultando base de datos...";

            fetch(URL_SCRIPT_GOOGLE, {
                method: "POST",
                mode: "cors",
                body: JSON.stringify({ dni: dni })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.autorizado) {
                        resultadoDiv.className = "autorizado";
                        resultadoDiv.innerHTML = `✅ ACCESO PERMITIDO<br>${data.nombre}<br>DNI: ${dni}`;
                    } else {
                        resultadoDiv.className = "denegado";
                        resultadoDiv.innerHTML = `🚨 ALERTA: NO AUTORIZADO<br>DNI: ${dni} no está en la lista.`;
                    }
                } else {
                    resultadoDiv.innerHTML = "⚠️ Error en la respuesta del servidor.";
                }
                setTimeout(() => { 
                    resultadoDiv.style.display = "none"; 
                    escaneando = true; // Reactiva la cámara tras 4 segundos
                }, 4000);
            })
            .catch(err => {
                console.error("Error:", err);
                resultadoDiv.className = "denegado";
                resultadoDiv.innerHTML = "❌ Error de conexión con Google Sheets.";
                setTimeout(() => { escaneando = true; }, 4000);
            });
        }
    </script>
</body>
</html>
